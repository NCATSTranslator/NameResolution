# Kubernetes file for setting up a PVC to use for nameres-loading.
#
# This is the Solr home (/var/solr): it holds the name_lookup core, which is the
# index itself and, at the end, the thing that gets tarred into the backup.
#
# ## Why 600Gi for a ~130Gi index
#
# Not padding. `optimize=true` merges everything into one segment by writing the new
# segment before dropping the old ones, so peak usage during that step is roughly
# double the finished index, and Lucene's guidance is to budget 2-3x.
#
# The finished index was ~127Gi for Babel 2025nov4. Newer releases are bigger, and
# the sizing has to hold for the release actually being loaded (SYNONYMS_URL in the
# Makefile), not the last one measured: at a 180Gi index, 3x is 540Gi and 400Gi would
# not be enough. The failure mode is the reason for the headroom -- running out of
# space happens during the optimize, which is the *last* step of a multi-hour load,
# and it takes the whole load with it.
#
# If storage quota is tight this can come down, but not below roughly 2x the finished
# index, and check the index size from the previous load before trimming it.
#
# ## Speed
#
# This volume takes the whole write load of the indexing run plus the read-and-write
# of the optimize, so its throughput is what decides how long a load takes. On
# `basic` (network storage) those two phases dominate. Moving the index to a
# node-local NVMe ephemeral volume is ready in a separate PR, blocked on issue #280,
# which asks for the namespace to support that storage class.
#
# ## Cleanup
#
# This is a PVC, so it outlives the pod: delete it by hand once the backup tarball
# has been copied somewhere safe, or it keeps several hundred GB reserved.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nameres-loading-solr
  labels:
    app: nameres-loading
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 600Gi
  storageClassName: basic
